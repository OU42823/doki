<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銅鐸 マーカーAR - モデル2</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        .back-link {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            text-decoration: none; background: rgba(255, 255, 255, 0.9); color: #334155;
            padding: 8px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .hint {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000;
            background: rgba(0, 0, 0, 0.75); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 0.9rem; pointer-events: none; text-align: center;
        }

        /* ⏳ ローディング画面のデザイン */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1e293b; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #3498db; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loading-text { font-size: 1rem; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- ⏳ ローディング画面 -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">カメラとARを準備中...</div>
    </div>

    <a href="{{ url_for('index') }}" class="back-link">⬅ 戻る</a>
    <div id="hint" class="hint">💡 マーカーをカメラに写し、モデルをダブルタップして音ON/OFF</div>

    <audio id="doutaku-sound" src="{{ url_for('static', filename='doutakuoto.mp3') }}" loop></audio>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: {{ url_for('static', filename='target.mind') }};" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <a-asset-item id="model2" src="{{ url_for('static', filename='doutaku2.glb') }}"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                id="doutaku-model"
                src="#model2" 
                position="0 0 0" 
                rotation="0 0 0" 
                scale="0.5 0.5 0.5"
                class="clickable">
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        const audio = document.getElementById('doutaku-sound');
        const hint = document.getElementById('hint');
        const modelEl = document.getElementById('doutaku-model');
        const loadingOverlay = document.getElementById('loading-overlay');
        const sceneEl = document.getElementById('ar-scene');

        sceneEl.addEventListener('arReady', () => {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => {
                loadingOverlay.style.display = 'none';
            }, 500);
        });

        let lastTapTime = 0;
        modelEl.addEventListener('click', () => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;

            if (tapLength < 300 && tapLength > 0) {
                toggleAudio();
            }
            lastTapTime = currentTime;
        });

        function toggleAudio() {
            if (audio.paused) {
                audio.play().catch(err => console.log("再生エラー:", err));
                hint.innerText = "🎵 音声を再生中...";
                hint.style.background = "rgba(231, 76, 60, 0.85)";
            } else {
                audio.pause();
                hint.innerText = "🔇 音声を停止しました";
                hint.style.background = "rgba(52, 73, 94, 0.85)";
            }
            setTimeout(() => {
                hint.innerText = "💡 マーカーをカメラに写し、モデルをダブルタップして音ON/OFF";
                hint.style.background = "rgba(0, 0, 0, 0.75)";
            }, 2000);
        }
    </script>
</body>
</html>
