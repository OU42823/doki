<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銅鐸 モデル 2</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #camera-video {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: 0; pointer-events: none;
        }

        header { padding: 12px 20px; background: rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; z-index: 10; backdrop-filter: blur(5px); }
        h1 { margin: 0; font-size: 1rem; text-align: center; flex: 1; }
        .back-link { text-decoration: none; background: #e2e8f0; color: #334155; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
        
        .viewer-container { position: relative; flex: 1; width: 100%; z-index: 5; }
        model-viewer { width: 100%; height: 100%; background: transparent; }

        .hint {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(0, 0, 0, 0.75); color: white; padding: 8px 16px;
            border-radius: 20px; font-size: 0.85rem; pointer-events: none; text-align: center; white-space: nowrap;
        }
    </style>
</head>
<body>

    <video id="camera-video" autoplay playsinline muted></video>

    <header>
        <a href="{{ url_for('index') }}" class="back-link">⬅ 戻る</a>
        <h1>銅鐸 モデル 2</h1>
        <div style="width: 45px;"></div>
    </header>

    <audio id="doutaku-sound" src="{{ url_for('static', filename='doutakuoto.mp3') }}" loop></audio>

    <div class="viewer-container">
        <div id="hint" class="hint">💡 モデルをダブルタップして音のON/OFF</div>
        
        <model-viewer 
            id="viewer"
            src="{{ url_for('static', filename='doutaku2.glb') }}" 
            ar ar-modes="webxr quick-look" 
            ar-scale="auto"
            camera-controls 
            interaction-prompt="auto"
            field-of-view="30deg"
            min-field-of-view="10deg"
            max-field-of-view="120deg"
            touch-action="pan-y" 
            shadow-intensity="1">
        </model-viewer>
    </div>

    <script>
        async function startCamera() {
            const videoElement = document.getElementById('camera-video');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                videoElement.srcObject = stream;
            } catch (err) {
                console.log("カメラ起動エラー:", err);
            }
        }
        startCamera();

        const audio = document.getElementById('doutaku-sound');
        const hint = document.getElementById('hint');
        const viewer = document.getElementById('viewer');

        let lastTapTime = 0;
        viewer.addEventListener('click', () => {
            const currentTime = new Date().getTime();
            if (currentTime - lastTapTime < 300 && currentTime - lastTapTime > 0) {
                if (audio.paused) {
                    audio.play().catch(err => console.log(err));
                    hint.innerText = "🎵 音声を再生中...";
                } else {
                    audio.pause();
                    hint.innerText = "🔇 音声を停止しました";
                }
            }
            lastTapTime = currentTime;
        });
    </script>
</body>
</html>
