<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銅鐸 モデル 1</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #1e293b; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { padding: 12px 20px; background: rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        h1 { margin: 0; font-size: 1rem; text-align: center; flex: 1; }
        .back-link { text-decoration: none; background: #e2e8f0; color: #334155; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
        
        .viewer-container { position: relative; flex: 1; width: 100%; }
        model-viewer { width: 100%; height: 100%; background-color: #1e293b; }

        .hint {
            position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(0, 0, 0, 0.75); color: white; padding: 8px 18px;
            border-radius: 20px; font-size: 0.85rem; pointer-events: none; text-align: center; white-space: nowrap;
        }

        /* 📷 スマホのカメラ（AR）を起動するボタン */
        #ar-button {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: #e74c3c; color: white; border: none; padding: 12px 24px;
            border-radius: 25px; font-weight: bold; font-size: 0.95rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <a href="{{ url_for('index') }}" class="back-link">⬅ 戻る</a>
        <h1>モデル 1</h1>
        <div style="width: 45px;"></div>
    </header>

    <audio id="doutaku-sound" src="{{ url_for('static', filename='doutakuoto.mp3') }}" loop></audio>

    <div class="viewer-container">
        <div id="hint" class="hint">💡 ダブルタップで音声ON/OFF</div>
        
        <!-- src はお前のファイル名 doutaku.glb に合わせてるで！ -->
        <model-viewer 
            id="viewer"
            src="{{ url_for('static', filename='doutaku.glb') }}" 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            ar-scale="auto"
            camera-controls 
            touch-action="pan-y"
            shadow-intensity="1">
            
            <button slot="ar-button" id="ar-button">
                📷 カメラで空間に表示（AR）
            </button>
        </model-viewer>
    </div>

    <script>
        const audio = document.getElementById('doutaku-sound');
        const hint = document.getElementById('hint');
        const viewer = document.getElementById('viewer');

        let lastTapTime = 0;
        viewer.addEventListener('click', () => {
            const currentTime = new Date().getTime();
            if (currentTime - lastTapTime < 300 && currentTime - lastTapTime > 0) {
                if (audio.paused) {
                    audio.play().catch(err => console.log(err));
                    hint.innerText = "🎵 音声を再生中...";
                    hint.style.background = "rgba(231, 76, 60, 0.85)";
                } else {
                    audio.pause();
                    hint.innerText = "🔇 音声を停止しました";
                    hint.style.background = "rgba(52, 73, 94, 0.85)";
                }
            }
            lastTapTime = currentTime;
        });
    </script>
</body>
</html>
