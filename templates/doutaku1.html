<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銅鐸 モデル 1</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f8f9fa; color: #333; }
        header { padding: 15px 20px; text-align: center; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.1rem; flex: 1; text-align: center; }
        
        .back-link {
            text-decoration: none; background: #e2e8f0; color: #334155; padding: 6px 12px;
            border-radius: 6px; font-size: 0.85rem; font-weight: bold;
        }

        .viewer-container { position: relative; width: 100%; height: 60vh; background: #eef1f3; }
        model-viewer { width: 100%; height: 100%; cursor: pointer; }
        
        /* 📱 右サイドの操作メニュー（位置リセット用） */
        .side-menu { position: absolute; top: 20px; right: 20px; z-index: 10; display: flex; flex-direction: column; gap: 10px; }

        .menu-btn {
            background-color: #3498db; color: white; border: none; border-radius: 8px;
            padding: 12px 16px; font-size: 0.9rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 6px;
        }

        /* 🎵 画面の下部に表示する音声の状態を知らせるメッセージ（お好みで） */
        .audio-hint {
            position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); color: white; padding: 8px 16px;
            border-radius: 20px; font-size: 0.85rem; pointer-events: none; z-index: 10;
            transition: opacity 0.3s;
        }

        #ar-button {
            background-color: rgba(255, 255, 255, 0.95); color: #2c3e50; border: 1px solid #cbd5e1;
            border-radius: 30px; padding: 12px 24px; font-size: 0.9rem; font-weight: bold;
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); cursor: pointer;
        }
        
        .info-panel { padding: 20px; background: white; }
        .info-panel h2 { margin-top: 0; font-size: 1.1rem; }
        .info-panel p { margin: 0; font-size: 0.9rem; color: #64748b; line-height: 1.6; }
    </style>
</head>
<body>

    <header>
        <a href="{{ url_for('index') }}" class="back-link">⬅ 戻る</a>
        <h1>銅鐸 モデル 1</h1>
        <div style="width: 50px;"></div>
    </header>

    <audio id="doutaku-sound" src="{{ url_for('static', filename='doutakuoto.mp3') }}" loop></audio>

    <div class="viewer-container">
        <model-viewer 
            id="viewer"
            src="{{ url_for('static', filename='doutaku.usdz') }}" 
            ios-src="{{ url_for('static', filename='doutaku.usdz') }}"
            ar ar-modes="webxr quick-look" ar-placement="floor"
            ar-scale="auto"
            camera-controls interaction-prompt="none"
            field-of-view="100deg"
            min-polar-angle="0deg" max-polar-angle="180deg"
            min-azimuth-angle="-infinity" max-azimuth-angle="infinity"
            interpolation-decay="10" orbit-sensitivity="1.8"
            touch-action="none" shadow-intensity="1">
            
            <button slot="ar-button" id="ar-button">✨ 部屋に配置してみる（AR）</button>
        </model-viewer>

        <!-- 🎵 操作ヒントの表示 -->
        <div id="audio-hint" class="audio-hint">💡 銅鐸をダブルタップして音のON/OFF</div>

        <div class="side-menu">
            <button class="menu-btn" onclick="resetModel()">
                <span>🔄</span> 位置リセット
            </button>
        </div>
    </div>

    <div class="info-panel">
        <h2>モデル 1 の解説</h2>
        <p>画面上の銅鐸を<strong>ダブルタップ</strong>すると、当時の響き（音声）の再生・停止が切り替わります。</p>
    </div>

    <script>
        const audio = document.getElementById('doutaku-sound');
        const viewer = document.getElementById('viewer');
        const hint = document.getElementById('audio-hint');

        // 🖱️ 3Dビューア部分をダブルタップ（PCはdblclick、スマホはタップ間隔で判定）したときの処理
        let lastTapTime = 0;
        viewer.addEventListener('click', (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            
            // 300ミリ秒以内に2回タップされたら「ダブルタップ」とみなす
            if (tapLength < 300 && tapLength > 0) {
                toggleAudio();
                e.preventDefault();
            }
            lastTapTime = currentTime;
        });

        function toggleAudio() {
            if (audio.paused) {
                audio.play().catch(err => console.log("再生エラー:", err));
                hint.innerText = "🎵 音声を再生中...";
                hint.style.background = "rgba(231, 76, 60, 0.85)";
            } else {
                audio.pause();
                hint.innerText = "🔇 音声を停止しました";
                hint.style.background = "rgba(52, 73, 94, 0.85)";
            }
            
            // 2秒後にヒントの表示を元に戻す
            setTimeout(() => {
                hint.innerText = "💡 銅鐸をダブルタップして音のON/OFF";
                hint.style.background = "rgba(0, 0, 0, 0.75)";
            }, 2000);
        }

        function resetModel() {
            viewer.cameraOrbit = 'auto auto auto';
            viewer.fieldOfView = '100deg';
            viewer.jumpCameraToGoal();
        }
    </script>
</body>
</html>
